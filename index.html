    <script>
      // Pasang tema sebelum CSS/React dimuat agar tidak berkedip. Logikanya
      // harus sama dengan parseThemePreference + resolveTheme di src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem('openpacket-theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Filter out benign ResizeObserver loop errors before Vite client attaches listeners
      window.addEventListener(
        'error',
        function (e) {
          if (
            e.message &&
            (e.message.includes('ResizeObserver loop completed with undelivered notifications') ||
              e.message.includes('ResizeObserver loop limit exceeded'))
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body class="bg-background text-foreground overflow-hidden">
    <div id="root"></div>

    <!--
      Konten statis untuk crawler (Googlebot, Bingbot) dan pengunjung
      tanpa JavaScript. Aplikasi OpenPacket adalah SPA, sehingga konten
      utama baru muncul setelah React mount. Blok ini memberi crawler
      teks yang bisa diindeks tanpa menunggu eksekusi JS.
    -->
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #ffffff; background: #1b2a4a">
        <h1>OpenPacket - Simulator Jaringan Edukasi</h1>
        <p>
          OpenPacket adalah simulator jaringan komputer berbasis web untuk belajar
          konfigurasi perangkat Cisco. Aplikasi ini berjalan langsung di browser
          tanpa instalasi dan dapat digunakan secara offline.
        </p>
        <h2>Fitur utama</h2>
        <ul>
          <li>Simulasi protokol jaringan: ARP (RFC 826), ICMP Echo / ping (RFC 792), dan IPv4 subnetting (RFC 791)</li>
          <li>Konfigurasi perangkat melalui antarmuka visual maupun terminal CLI bergaya Cisco IOS</li>
          <li>Perangkat yang didukung: PC, laptop, router, switch, server, access point, cloud, dan kabel jaringan</li>
          <li>Mode Lab Praktikum dengan studi kasus: gateway salah, NAT internet, dan VLAN router-on-a-stick</li>
          <li>Mode Kelas untuk guru dan siswa: distribusi soal, pengumpulan jawaban, penilaian otomatis, dan batas cek mandiri</li>
          <li>Visualisasi perjalanan paket secara animasi dan log event simulasi</li>
          <li>12 template topologi siap pakai dan dukungan muat/simpan topologi dalam format JSON</li>
        </ul>
        <h2>Untuk siapa</h2>
        <p>
          Cocok untuk siswa SMK jurusan TKJ, mahasiswa Teknik Informatika dan
          Sistem Informasi, peserta pelatihan jaringan, serta guru dan dosen yang
          membutuhkan media praktikum jaringan komputer tanpa harus memasang
          perangkat lunak berat seperti Cisco Packet Tracer atau GNS3.
        </p>
        <p>
          <strong>Catatan:</strong> aplikasi ini memerlukan JavaScript aktif untuk
          menjalankan simulasi. Silakan aktifkan JavaScript pada browser Anda.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
