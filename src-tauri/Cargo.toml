[package]
name = "openpacket"
version = "1.0.0"
description = "OpenPacket - Lightweight Educational Network Simulator"
authors = ["OpenPacket Team"]
edition = "2021"

# Aplikasi desktop-only: target binary tunggal (src/main.rs), tanpa lib.
# Bagian [lib] sengaja dihilangkan — keberadaannya tanpa src/lib.rs
# membuat `cargo metadata` gagal ("can't find library openpacket_lib").

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
