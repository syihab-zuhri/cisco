[package]
name = "openpacket"
version = "1.0.0"
description = "OpenPacket - Lightweight Educational Network Simulator"
authors = ["OpenPacket Team"]
edition = "2021"

[lib]
name = "openpacket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
